# SYNTHETIC-FIXTURES-ONLY REPO: nothing in this workflow (or any workflow here)
# calls an external job site. Tests run over committed synthetic fixtures.
# Standard CI: install deps and run the test suite on every push and PR.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
